<!-- Script for AI Generation -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const apiKeyInput = document.getElementById("ai-api-key");
      const imagesInput = document.getElementById("ai-images-input");
      const generateBtn = document.getElementById("ai-generate-btn");
      const statusDiv = document.getElementById("ai-status");

      const savedKey = localStorage.getItem("tp_gemini_key");
      if (savedKey) apiKeyInput.value = savedKey;

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve({
            inlineData: {
              data: reader.result.split(',')[1],
              mimeType: file.type
            }
          });
          reader.onerror = error => reject(error);
        });
      }

      generateBtn.addEventListener("click", async function () {
        const apiKey = apiKeyInput.value.trim();
        const files = Array.from(imagesInput.files);

        if (!apiKey) {
          alert("Please enter your Gemini API Key.");
          return;
        }

        if (files.length < 3) {
          alert("Please select at least 3 images.");
          return;
        }

        localStorage.setItem("tp_gemini_key", apiKey);
        generateBtn.disabled = true;
        statusDiv.style.color = "#38bdf8";
        statusDiv.innerText = "⏳ Connecting to Gemini 2.5 Flash...";

        try {
          const imageParts = await Promise.all(files.map(f => fileToBase64(f)));

          const promptText = `Analyze these ${files.length} images for a hardware/technical publication called TechPulse.
Generate a comprehensive, cohesive technical article in English that connects the topics, components, or systems shown in all images.

Return ONLY a raw JSON object matching this structure (no markdown fences, no \`\`\`json):
{
  "title": "A captivating technical article title in English",
  "category": "Technology", 
  "excerpt": "A concise 2-sentence summary of the article",
  "tags": "tag1, tag2, tag3",
  "readTime": "5 min",
  "content": "Detailed technical content written in English. Separate paragraphs with double newlines."
}
Allowed values for category are strictly: "Technology", "Petroleum", "Gas", or "Programming". Choose the best fit based on images.`;

          // استخدام الموديل gemini-2.5-flash مباشرة
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [...imageParts, { text: promptText }]
              }]
            })
          });

          const data = await res.json();

          if (data.error) {
            throw new Error(data.error.message || "API Error");
          }

          if (!data.candidates || !data.candidates[0]) {
            throw new Error("No response generated from the model.");
          }

          const rawText = data.candidates[0].content.parts[0].text;
          const cleanJson = rawText.replace(/```json|```/g, '').trim();
          const article = JSON.parse(cleanJson);

          // Auto-fill form fields
          document.getElementById('title').value = article.title || '';
          document.getElementById('excerpt').value = article.excerpt || '';
          document.getElementById('content').value = article.content || '';
          document.getElementById('tags').value = article.tags || '';
          document.getElementById('readTime').value = article.readTime || '5 min';
          document.getElementById('author').value = 'TechPulse Team';

          if (!document.getElementById('date').value) {
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
          }

          const catSelect = document.getElementById('category');
          if (article.category && Array.from(catSelect.options).some(o => o.value === article.category)) {
            catSelect.value = article.category;
          } else {
            catSelect.value = "Technology";
          }

          document.getElementById('title').dispatchEvent(new Event('input'));

          statusDiv.style.color = "#4ade80";
          statusDiv.innerText = "✅ Article successfully generated and form filled!";

        } catch (err) {
          console.error(err);
          statusDiv.style.color = "#f87171";
          statusDiv.innerText = "❌ Error: " + err.message;
        } finally {
          generateBtn.disabled = false;
        }
      });
    });
  </script>
