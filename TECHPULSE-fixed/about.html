<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us | TechPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lang-select {
      background: var(--bg-secondary, #1e293b);
      color: var(--text-color, #f8fafc);
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container">
      <div class="logo">
        <a href="index.html" aria-label="TechPulse Home">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>TechPulse</span>
        </a>
      </div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="about.html" class="active" data-i18n="nav_about">About</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
        <a href="privacy-policy.html" data-i18n="nav_privacy">Privacy</a>
        <a href="terms.html" data-i18n="nav_terms">Terms</a>
        
        <!-- Multi-language Selector -->
        <select id="languageSelector" class="lang-select">
          <option value="en">English</option>
          <option value="zh">中文 (Chinese)</option>
          <option value="es">Español</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="fr">Français</option>
        </select>

        <a href="admin.html" id="adminBtn" class="admin-btn" style="display: none;">Admin</a>
        <button id="darkModeToggle" type="button" aria-pressed="false" aria-label="Switch theme">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 40px 0;">
    <h1 data-i18n="about_title">About TechPulse</h1>
    <p style="margin-top: 16px; line-height: 1.6;" data-i18n="about_desc">
      TechPulse is a dedicated engineering platform for embedded systems, microcontrollers, and hardware tutorials.
    </p>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 TechPulse. All rights reserved.</p>
      <div class="footer-links">
        <a href="privacy-policy.html" data-i18n="nav_privacy">Privacy Policy</a>
        <a href="terms.html" data-i18n="nav_terms">Terms of Service</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
